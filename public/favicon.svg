<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>JA monogram</title>

  <defs>
    <!-- deep space background -->
    <radialGradient id="bg" cx="50%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#141e3c"/>
      <stop offset="55%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>

    <!-- soft halo behind letters -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- letter gradient (cyan -> blue -> violet) -->
    <linearGradient id="ink" x1="14" y1="16" x2="50" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>

    <!-- rotating gradient for the ring -->
    <linearGradient id="ring" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 32 32" to="360 32 32" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- glass sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="glowTight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- breathing halo -->
  <ellipse cx="32" cy="33" rx="21" ry="17" fill="url(#halo)">
    <animate attributeName="opacity" values="1;.7;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- gradient ring: soft neon glow + crisp edge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#ring)"
        stroke-width="7" opacity=".55" filter="url(#glowSoft)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#ring)"
        stroke-width="3"/>

  <!-- inner hairline (glass rim) -->
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="12.5" fill="none"
        stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>

  <!-- neon glow behind monogram -->
  <g fill="none" stroke="url(#ink)" stroke-width="6" stroke-linecap="round"
     stroke-linejoin="round" opacity=".85" filter="url(#glowTight)">
    <path d="M27.5 19 V36.5 A6.5 6.5 0 0 1 14.5 36.5"/>
    <path d="M33.5 43 L41.5 19 L49.5 43"/>
    <path d="M37 34 H46"/>
  </g>

  <!-- monogram (custom vector paths — no font needed) -->
  <g fill="none" stroke="url(#ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27.5 19 V36.5 A6.5 6.5 0 0 1 14.5 36.5"/>
    <path d="M33.5 43 L41.5 19 L49.5 43"/>
    <path d="M37 34 H46"/>
  </g>

  <!-- glass sheen -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sheen)"/>

  <!-- sparkle accents -->
  <path d="M51 11l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9-2.9-1.1 2.9-1.1z" fill="#e0f2fe">
    <animate attributeName="opacity" values=".9;.35;.9" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="55.5" cy="21.5" r="1.2" fill="#c084fc" opacity=".7"/>
</svg>